<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교특집행 CHECK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
header{background:linear-gradient(135deg,#172554,#315efb);color:white;padding:34px 20px}
.wrap{max-width:1200px;margin:auto}.brand{font-size:29px;font-weight:800}.sub{margin-top:7px;opacity:.9}
.search{margin-top:22px;width:100%;padding:16px 18px;border:0;border-radius:12px;font-size:16px}
main{padding:22px 20px 50px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{cursor:pointer;border:1px solid #dfe3eb;background:#fff;border-radius:9px;padding:9px 13px}
.filter.active{background:#315efb;color:#fff;border-color:#315efb}
.stats{color:#667085;font-size:14px;margin-left:auto;padding:10px}
.card{background:white;border:1px solid #e1e5ec;border-radius:14px;margin:12px 0;padding:18px;box-shadow:0 2px 8px #1018280a}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tag{font-size:12px;background:#eef3ff;color:#3154ad;padding:5px 8px;border-radius:99px}
.question{font-size:16px;font-weight:700;line-height:1.55;margin-bottom:15px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.answer{padding:10px 17px;border-radius:8px;font-weight:700}
.answer.yes{background:#eef8f2;color:#087443;border:1px solid #a9dfc2}
.answer.no{background:#fff3f0;color:#b42318;border:1px solid #f0b8ad}
.answer.sel{outline:3px solid #dbe4ff}
.feedback{margin-top:14px;padding:15px;border-radius:10px;background:#f8fafc;border-left:4px solid #315efb;display:none}
.feedback.show{display:block}.feedback strong{display:block;margin-bottom:6px}.detail{color:#667085;font-size:13px;line-height:1.6}
mark{background:#fff0a8}.empty{text-align:center;padding:50px;background:#fff;border-radius:14px;color:#667085}
.summary{display:none;background:#fff;border:1px solid #dce2ec;border-radius:14px;padding:18px;margin-bottom:18px}
.summary.show{display:block}.summary h2{margin:0 0 12px;font-size:18px}
.metric{display:inline-block;margin:4px 6px 4px 0;padding:8px 11px;border-radius:8px;background:#f3f4f6}
@media(max-width:600px){.brand{font-size:24px}.stats{width:100%;margin-left:0}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="brand">교특집행 CHECK</div>
<div class="sub">체크리스트를 확인하고 답변을 선택하면 해당 판단 결과가 바로 표시됩니다.</div>
<input id="search" class="search" placeholder="체크리스트 검색">
</div></header>
<main class="wrap">
<div class="toolbar" id="filters"></div>
<div id="summary" class="summary">
<h2>점검 결과</h2>
<div id="metrics"></div>
</div>
<div class="toolbar"><div id="stats" class="stats"></div></div>
<div id="list"></div>
</main>
<script>
const DATA=[{"keywords": ["핵심어"], "check": "체크리스트 내용", "result": "해당된다면", "detail": "세부설명"}, {"keywords": ["공사", "계약"], "check": "추정금액 5억원(전문공사 3억원) 이상인가?", "result": "계약심사 대상", "detail": ""}, {"keywords": ["공사", "계약"], "check": "계약금액 20억원 이상인 공사면서, 1회 설계변경이 계약금액의 10%이상 증액됐는가?", "result": "계약심사 대상", "detail": ""}, {"keywords": ["용역", "계약"], "check": "추정금액 7천만원 이상 용역인가?", "result": "계약심사 대상", "detail": ""}, {"keywords": ["물품", "계약"], "check": "추정금액 2천만원 이상 물품인가?", "result": "계약심사 대상", "detail": ""}, {"keywords": ["공사", "계약"], "check": "종합공사 추정가격 10억원 이상인가?", "result": "일상감사 대상", "detail": ""}, {"keywords": ["공사", "계약"], "check": "전문공사 추정가격 5억원 이상인가?", "result": "일상감사 대상", "detail": ""}, {"keywords": ["공사", "계약"], "check": "협상에 의한 계약으로 하는 공사인가?", "result": "일상감사 대상", "detail": ""}, {"keywords": ["용역", "계약"], "check": "추정가격 3억원 이상 용역인가?", "result": "일상감사 대상", "detail": ""}, {"keywords": ["물품", "계약"], "check": "추정금액 1억원 이상 물품인가?", "result": "일상감사 대상", "detail": ""}, {"keywords": ["공사", "용역", "물품", "계약"], "check": "법령에서 정한 금액 이상의 지명입찰계약 및 수의계약인가?", "result": "일상감사 대상", "detail": ""}, {"keywords": ["공사", "용역", "물품", "계약"], "check": "설계변경 등으로 최종 추정가격이 일상감사 대상금액을 초과하게 된 계약인가?", "result": "일상감사 대상", "detail": ""}, {"keywords": ["공사", "용역", "물품", "계약"], "check": "설계 변경 등으로 증액이 직전 일상감사 받은 계약금액의 10% 이상에 해당하는 계약인가?", "result": "일상감사 대상", "detail": ""}, {"keywords": ["물품", "물품선정위원회"], "check": "1회 납품 총액 기준으로 추정가격 2천만 원 초과인가?", "result": "물품선정위원회 실시 대상", "detail": ""}, {"keywords": ["물품", "물품선정위원회"], "check": "수요자 중심 5인 미만으로 구성됐는가?", "result": "감사 대상", "detail": "5인 이상 구성 필요"}, {"keywords": ["물품", "물품선정위원회"], "check": "물품선정위원회에 기관장, 업무담당이 포함됐는가?", "result": "감사 대상", "detail": "제외"}, {"keywords": ["물품", "물품선정위원회"], "check": "방송장비, 공기순환기와 부속물품을 구매하는가?", "result": "물품선정위원회 추첨제 대상", "detail": ""}, {"keywords": ["물품", "물품선정위원회"], "check": "물품선정위원회 추첨제의 구성은 내부위원, 업무와 유관한 인사로 위촉했는가?", "result": "감사 대상", "detail": "외부위원, 업무와 무관한 인사 위촉"}, {"keywords": ["공사", "계약"], "check": "추정가격 2천만원 이하의 공사인가?", "result": "1인 견적 제출 수의계약", "detail": ""}, {"keywords": ["공사", "계약"], "check": "종합공사 추정가격  4억원 이하의 공사인가?", "result": "2인 이상 견적 제출(소액수의)", "detail": ""}, {"keywords": ["공사", "계약"], "check": "전문공사 추정가격  2억원 이하의 공사인가?", "result": "2인 이상 견적 제출(소액수의)", "detail": ""}, {"keywords": ["공사", "계약"], "check": "전기, 통신, 소방 추정가격  1억 6천만원 이하의 공사인가?", "result": "2인 이상 견적 제출(소액수의)", "detail": ""}, {"keywords": ["물품", "용역", "계약"], "check": "추정가격 2천만원 이하의 물품, 용역인가?", "result": "1인 견적 제출 수의계약", "detail": ""}, {"keywords": ["물품", "용역", "계약"], "check": "추정가격 5천만원 이하이면서 여성, 장애인 기업, 사회적, 자활기업 등 취약계층 고용기업 물품, 용역인가?", "result": "1인 견적 제출 수의계약", "detail": ""}, {"keywords": ["물품", "용역", "계약"], "check": "추정가격 2천만원 초과 1억원 이하이면서 소기업, 소상공인, 학술연구, 원가계산 등의 용역, 물품인가?", "result": "2인 이상 견적 제출(소액수의)", "detail": ""}, {"keywords": ["공사", "계약"], "check": "동일 구조물 공사, 단일 공사인가?", "result": "분할계약 대상", "detail": ""}, {"keywords": ["공사", "계약"], "check": "전기, 통신, 소방 공사가 각각 합쳐져 있는가?", "result": "분할계약 대상(각각 따로 계약)", "detail": ""}, {"keywords": ["용역", "계약"], "check": "100톤 이상 폐기물처리용역이 공사 등에 발주되어 있는가?", "result": "분할계약 대상", "detail": ""}, {"keywords": ["예산", "지출"], "check": "작년도 여비를 올해 지급했는가?", "result": "감사 대상", "detail": "회계연도 독립의 원칙에 의거, 당해년도 지급"}, {"keywords": ["지출", "물품"], "check": "물품검사검수서를 제출했는가?", "result": "제출 필요", "detail": ""}, {"keywords": ["지출"], "check": "대금지급 요청 시, 대금청구일로부터 7일 이후 지출했는가?", "result": "감사 대상", "detail": "7일 이내 지출"}, {"keywords": ["지출", "업무추진비"], "check": "심야(23시 이후)와 사용자의 자택 근처 등 통상적인 업무 추진과 관련이 적은 시간과 장소에서 사용했는가?", "result": "감사 대상", "detail": "사용 불가"}, {"keywords": ["지출", "업무추진비"], "check": "공직자가 아닌 대상에게 1인 1회당 4만원 초과의 범위에서 집행했는가?", "result": "감사 대상", "detail": "1인 1회당 4만원 이하 범위에서 지출"}, {"keywords": ["지출", "업무추진비"], "check": "공직자에게 1인 1회당 접대비 3만원 초과, 기념품 및 특산품은 5만원 초과의 범위에서 집행했는가?", "result": "감사 대상", "detail": "접대비는 3만원 이하, 기념품 및 특산품은 5만원 이하 지급"}, {"keywords": ["지출", "업무추진비"], "check": "증빙서류에 집행목적, 일시, 장소, 집행대상이 모두 작성되었는가?", "result": "작성 필요", "detail": ""}, {"keywords": ["지출", "업무추진비"], "check": "1건당 50만원 이상의 경우에 주된 상대방의 소속 또는 주소 및 성명을 증빙서류에 기재했는가?", "result": "작성 필요", "detail": ""}, {"keywords": ["지출", "강사수당"], "check": "수강 인원수에 따라 강사수당을 가산할 경우 증빙자료(출석부 등)를 제출하였는가?", "result": "제출 필요", "detail": ""}, {"keywords": ["지출", "강사수당"], "check": "원고가 중복하여 사용되었을 경우, 감액하여 지급하였는가?", "result": "확인 필요", "detail": ""}];
let active="전체";
const state={};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hl(s,q){
 if(!q)return esc(s);
 let ts=q.trim().split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
 return esc(s).replace(new RegExp("("+ts.join("|")+")","gi"),"<mark>$1</mark>");
}
const keys=[...new Set(DATA.flatMap(x=>x.keywords))];
function filters(){
 let f=document.getElementById("filters");f.innerHTML="";
 [["전체",DATA.length],...keys.map(k=>[k,DATA.filter(x=>x.keywords.includes(k)).length])].forEach(([k,n])=>{
  let b=document.createElement("button");b.className="filter "+(active===k?"active":"");b.textContent=k+" ("+n+")";
  b.onclick=()=>{active=k;filters();render()};f.appendChild(b);
 });
}
function render(){
 let q=document.getElementById("search").value.trim().toLowerCase();
 let arr=DATA.map((x,i)=>({...x,i})).filter(x=>{
  if(active!=="전체"&&!x.keywords.includes(active))return false;
  if(!q)return true;
  return q.split(/\s+/).every(t=>[...x.keywords,x.check,x.result,x.detail].join(" ").toLowerCase().includes(t));
 });
 document.getElementById("stats").textContent="표시 "+arr.length+"건 / 전체 "+DATA.length+"건";
 let list=document.getElementById("list");
 if(!arr.length){list.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return;}
 list.innerHTML=arr.map(x=>`
 <article class="card">
  <div class="question">${hl(x.check,q)}</div>
  <div class="actions">
   <button class="answer yes ${state[x.i]==='yes'?'sel':''}" onclick="answer(${x.i},'yes')">☑ 해당됨</button>
   <button class="answer no ${state[x.i]==='no'?'sel':''}" onclick="answer(${x.i},'no')">☐ 해당 없음</button>
  </div>
  <div class="feedback ${state[x.i]?'show':''}">
   <strong>${state[x.i]==='yes'?'판단 결과: '+hl(x.result,q):'판단 결과: 해당 없음'}</strong>
   <div class="detail">${state[x.i]==='yes'?hl(x.detail,q):'이 항목은 현재 점검 대상에 해당하지 않는 것으로 선택되었습니다.'}</div>
  </div>
 </article>`).join("");
 updateSummary();
}
function answer(i,v){
 if(state[i]===v){delete state[i];}
 else{state[i]=v;}
 render();
}
function updateSummary(){
 let vals=Object.values(state), yes=vals.filter(v=>v==="yes").length,no=vals.filter(v=>v==="no").length,un=DATA.length-vals.length;
 let s=document.getElementById("summary"),m=document.getElementById("metrics");
 if(!vals.length){s.classList.remove("show");return;}
 s.classList.add("show");
 m.innerHTML=`<span class="metric">해당됨 <b>${yes}</b></span>
 <span class="metric">해당 없음 <b>${no}</b></span>
 <span class="metric">미점검 <b>${un}</b></span>`;
}
document.getElementById("search").addEventListener("input",render);
filters();render();
</script>
</body></html>
